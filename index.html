<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DashUI - Automotive UI/UX Archive</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 50px auto;
    }

    h1 {
      font-weight: 700;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .description {
      color: #aaa;
      font-size: 1rem;
      line-height: 1.6;
      font-weight: 400;
    }

    .gallery {
      column-count: 3;
      column-gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .gallery-item img,
    .gallery-item video {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.2s ease;
    }

    .gallery-item:hover img,
    .gallery-item:hover video {
      transform: scale(1.02);
    }

    .credits {
      padding: 10px 12px;
      font-size: 0.75rem;
      color: #888;
    }

    .credits a {
      color: #ccc;
      text-decoration: none;
    }

    .credits a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .gallery {
        column-count: 1;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>DashUI - Car Interface Archive</h1>
    <p class="description">
      A curated collection of information and interaction design solutions from modern and classic cars, serving as a great source of inspiration. Curaded by Pablo Robles.
    </p>
  </header>

  <div class="gallery" id="gallery"></div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const gallery = document.getElementById("gallery");

      try {
        const response = await fetch('data.json');
        const items = await response.json();

        for (let i = items.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }

        items.forEach(item => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "gallery-item";

          let mediaHTML = "";
          if (item.type === "video") {
            mediaHTML = `
              <video autoplay loop muted playsinline>
                <source src="${item.src}" type="video/mp4">
              </video>`;
          } else {
            mediaHTML = `<img src="${item.src}" alt="${item.alt || ''}">`;
          }

          const creditLink = item.creditUrl 
            ? `<a href="${item.creditUrl}" target="_blank">${item.creditText}</a>`
            : item.creditText;

          itemDiv.innerHTML = `
            ${mediaHTML}
            <div class="credits">
              © ${creditLink}
            </div>
          `;

          gallery.appendChild(itemDiv);
        });
      } catch (error) {
        console.error("Error loading gallery data:", error);
      }
    });
  </script>

</body>
</html>
