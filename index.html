<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DashUI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #222222;
      color: #fff;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 40px;
    }

    .gallery {
      column-count: 3;
      column-gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery img {
      width: 100%;
      margin-bottom: 15px;
      border-radius: 8px;
      display: block;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .gallery img:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      .gallery {
        column-count: 1;
      }
    }
  </style>
</head>
<body>

  <h1>DashUI</h1>

  <div class="gallery">
    <img src="https://picsum.photos/400/600?random=1" alt="Photo 1">
    <img src="https://picsum.photos/400/300?random=2" alt="Photo 2">
    <img src="https://picsum.photos/400/500?random=3" alt="Photo 3">
    <img src="https://picsum.photos/400/400?random=4" alt="Photo 4">
    <img src="https://picsum.photos/400/700?random=5" alt="Photo 5">
    <img src="https://picsum.photos/400/350?random=6" alt="Photo 6">
  </div>

</body>
</html>
